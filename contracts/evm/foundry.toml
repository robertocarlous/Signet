[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
bytecode_hash = "none"
gas_reports = ["SignetSchemaRegistry", "SignetAttestationRegistry"]
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

# Monad testnet — chain id 10143, symbol MON, explorer https://testnet.monadscan.com
# Alternates if this rate-limits: https://rpc-testnet.monadinfra.com | https://testnet-rpc.monad.xyz
[rpc_endpoints]
monad_testnet = "https://rpc.ankr.com/monad_testnet"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "https://api-testnet.monadscan.com/api", chain = 10143 }
